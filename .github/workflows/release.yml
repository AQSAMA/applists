name: Create Release

on:
  push:
    tags:
      - "v*" # Trigger on tags like v1.0.0, v2.1.3

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating releases
    steps:
      - name: 🏗 Setup Repo
        uses: actions/checkout@v3

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 🏗 Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: pnpm install

      - name: 🚀 Build APK
        id: build_apk
        shell: bash
        run: |
          set -o pipefail
          # Run the build with --json for reliable parsing
          # Use --no-wait to start build and get ID immediately
          BUILD_OUTPUT=$(eas build --platform android --profile preview --non-interactive --no-wait --json)

          # Extract the Build ID from JSON output using jq
          BUILD_ID=$(echo "$BUILD_OUTPUT" | jq -r '.[0].id')

          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" == "null" ]; then
            echo "Error: Could not find Build ID in output"
            echo "Output was: $BUILD_OUTPUT"
            exit 1
          fi

          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "Build started with ID: $BUILD_ID"

      - name: ⏳ Wait for Build
        run: |
          eas build:wait --id ${{ env.BUILD_ID }}

      - name: 📥 Download Build
        run: |
          # Get the download URL from the build details
          DOWNLOAD_URL=$(eas build:view --id ${{ env.BUILD_ID }} --json | jq -r .artifacts.buildUrl)

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
            echo "Error: Could not find download URL"
            exit 1
          fi

          echo "Downloading from $DOWNLOAD_URL"
          curl -L -o app-release.apk "$DOWNLOAD_URL"

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
