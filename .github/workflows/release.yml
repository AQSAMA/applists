name: Create Release

on:
  push:
    tags:
      - "v*" # Trigger on tags like v1.0.0, v2.1.3

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating releases
    steps:
      - name: 🏗 Setup Repo
        uses: actions/checkout@v3

      - name: 🏗 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: 🏗 Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          packager: bun
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🚀 Build APK
        id: build_apk
        shell: bash
        run: |
          set -o pipefail
          # Run the build synchronously (waits for completion) with --json for reliable parsing
          BUILD_OUTPUT=$(eas build --platform android --profile preview --non-interactive --json)

          # Extract the download URL from JSON output using jq
          DOWNLOAD_URL=$(echo "$BUILD_OUTPUT" | jq -r '.[0].artifacts.buildUrl')

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
            echo "Error: Could not find download URL in output"
            echo "Output was: $BUILD_OUTPUT"
            exit 1
          fi

          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
          echo "Build completed! Download URL: $DOWNLOAD_URL"

      - name: 📥 Download Build
        run: |
          echo "Downloading from ${{ steps.build_apk.outputs.DOWNLOAD_URL }}"
          curl -L -o app-release.apk "${{ steps.build_apk.outputs.DOWNLOAD_URL }}"

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
